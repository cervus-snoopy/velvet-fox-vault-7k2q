<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SHADOW VAULT — a stealth game</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #070a10;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #e8eef7;
      }
      #game {
        width: 1280px;
        height: 800px;
        max-width: 100vw;
        max-height: calc(100vh - 40px);
        object-fit: contain;
        background: #0b101c;
        display: block;
      }
      #status {
        margin-top: 8px;
        font-size: 13px;
        color: #9fb0c8;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="2560" height="1600" aria-label="SHADOW VAULT stealth game canvas"></canvas>
    <div id="status" role="status">Loading SHADOW VAULT…</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
